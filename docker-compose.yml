version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: chatbot-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: chatbot-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MONGODB_URI: mongodb://root:password@mongodb:27017/chatbot?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TESTING_MODE_ENABLED: "true"
      UNRESTRICTED_TESTING: "true"
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./logs:/app/logs

volumes:
  mongo_data:
  redis_data:
